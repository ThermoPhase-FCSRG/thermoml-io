name: Publish PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build pyyaml twine
      - name: Check rights boundary
        run: |
          python scripts/sync_deps.py --check
          python scripts/check_data_rights.py
      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = "${{ github.ref_name }}"
          if tag != f"v{version}":
              raise SystemExit(f"Tag/version mismatch: {tag!r} != v{version}")
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist/*
      - name: Smoke-test wheel in a clean environment
        shell: bash
        run: |
          python -m venv .venv-smoke
          source .venv-smoke/bin/activate
          python -m pip install dist/*.whl
          python -c "import thermoml_io; print(thermoml_io.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/thermoml-io/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
