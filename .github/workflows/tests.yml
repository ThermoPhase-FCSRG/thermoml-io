name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: test

      - name: Run branch-aware coverage gate
        run: pixi run -e test test-cov

      - name: Check data-rights boundary
        if: runner.os == 'Linux'
        run: pixi run -e test check-data-rights

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
