name: Scientific Notebooks

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 1 * *"

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: notebooks

      - name: Check Jupytext synchronization
        shell: bash
        run: |
          pixi run -e notebooks notebooks-sync
          git diff --exit-code -- notebooks

      - name: Execute live ThermoML analysis
        if: github.event_name != 'pull_request'
        run: pixi run -e notebooks notebooks-run

      - name: Upload executed notebooks
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: executed-notebooks
          path: notebooks/*.ipynb
