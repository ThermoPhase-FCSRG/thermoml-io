name: Quality and Packaging

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: default
      - name: Lint
        run: pixi run -e default lint
      - name: Check formatting
        run: pixi run -e default format-check
      - name: Type check
        run: pixi run -e default typecheck
      - name: Check dependency metadata
        run: pixi run -e default sync-deps-check
      - name: Validate data boundary
        run: pixi run -e default check-data-rights
      - name: Build distributions
        run: pixi run -e default build
      - name: Check package metadata
        run: pixi run -e default twine check dist/*
      - name: Check distribution contents
        run: pixi run -e default check-dist

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: docs
      - name: Build documentation strictly
        run: pixi run -e docs docs-check
